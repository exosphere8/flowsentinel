[package]
name = "live-capture"
description = "FlowSentinel authorized live capture: packet sources, bounded capture sessions, pcap writing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
publish.workspace = true

[features]
# Capture from network interfaces through libpcap (libpcap-dev on Linux,
# the Npcap SDK on Windows). Without it, only replay sources exist.
libpcap = ["dep:pcap"]

[dependencies]
capture.workspace = true
pcap = { workspace = true, optional = true }
sha2.workspace = true
thiserror.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
