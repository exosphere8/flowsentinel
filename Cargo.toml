[workspace]
resolver = "3"
members = [
    "crates/analysis",
    "crates/api-server",
    "crates/capture",
    "crates/cli",
    "crates/decoder",
    "crates/detection-engine",
    "crates/filter-language",
    "crates/live-capture",
    "crates/flow-engine",
    "crates/storage",
]
# Built separately with a nightly toolchain; see fuzz/README.md.
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
authors = ["exosphere8"]
repository = "https://github.com/exosphere8/flowsentinel"
publish = false

[workspace.dependencies]
# Workspace crates
analysis = { path = "crates/analysis" }
capture = { path = "crates/capture" }
decoder = { path = "crates/decoder" }
detection-engine = { path = "crates/detection-engine" }
filter-language = { path = "crates/filter-language" }
live-capture = { path = "crates/live-capture" }
flow-engine = { path = "crates/flow-engine" }
storage = { path = "crates/storage" }

# Third-party crates
argon2 = "0.6.0"
axum = "0.8.9"
clap = { version = "4.6.7", features = ["derive"] }
# The version argon2's password-hash uses, so there is one copy.
getrandom = "0.4.3"
futures-util = { version = "0.3.34", default-features = false }
libc = "0.2.190"
pcap = "2.5.0"
# OpenTelemetry export (api-server feature `otel` only).
opentelemetry = "0.33.0"
opentelemetry_sdk = "0.33.0"
opentelemetry-otlp = { version = "0.33.0", default-features = false, features = ["http-proto", "trace", "reqwest-blocking-client"] }
tracing-opentelemetry = "0.34.0"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
# 0.8 is the newest line that supports the workspace's Rust 1.85 minimum.
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-native-roots", "postgres", "macros", "migrate", "json", "ipnetwork"] }
tempfile = "3.27.0"
thiserror = "2.0.21"
# 1.x supports the workspace's Rust 1.85 minimum.
toml = "1.1.6"
tokio = { version = "1.53.2", features = ["macros", "rt-multi-thread", "net", "signal"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["fs", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
# 5.x supports the workspace's Rust 1.85 minimum (6.x needs 1.88).
utoipa = "5.5.0"

# Test-only dependencies
proptest = "1.11.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# Hostile input must never crash the server or the CLI: no panicking
# shortcuts outside tests (clippy.toml allows them in tests).
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
todo = "deny"
unimplemented = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
