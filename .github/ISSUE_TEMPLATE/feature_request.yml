name: Feature request
description: Suggest an improvement.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        FlowSentinel is a defensive, metadata-first analyzer. Requests for packet injection,
        active scanning, payload storage, decryption or credential extraction are out of scope.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
