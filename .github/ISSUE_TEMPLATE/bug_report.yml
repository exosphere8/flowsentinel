name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. **Do not attach real captures or anything containing
        credentials, IP addresses or other data you are not allowed to share.** If the problem
        needs a capture, describe it or make a small synthetic one. For security issues, use
        private reporting instead (see SECURITY.md).
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `flowsentinel --version` or `flowsentinel-api --version`, or the commit.
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      options: [CLI, API server, Dashboard, Live capture, Container or Compose, Documentation, Other]
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, and how you run it (binary, container, built from source).
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Commands, requests or clicks. Include the request ID (X-Request-Id) for API errors.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: Remove anything sensitive first.
      render: text
