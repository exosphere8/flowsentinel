# Builds and publishes a release when a tag vX.Y.Z is pushed (see
# docs/releasing.md):
#   - binaries for Linux, macOS and Windows, with build provenance;
#   - a container image for linux/amd64 and linux/arm64 on ghcr.io, with an
#     SBOM and provenance;
#   - a GitHub release with the changelog section and SHA-256 checksums.
#
# Nothing is published until everything has been built and tested: the
# images are smoke-tested before they are pushed by digest, and the image
# tags and the GitHub release come last.
#
# The same builds run without publishing on branches and pull requests that
# change what a release is made from, and on demand (workflow_dispatch).
name: Release

on:
  push:
    tags: ["v*.*.*"]
    branches: [main, "feature/**"]
    paths:
      - .github/workflows/release.yml
      - scripts/check_release.py
      - scripts/third_party_licenses.py
      - Dockerfile
      - Cargo.toml
      - Cargo.lock
      - CHANGELOG.md
      - frontend/package-lock.json
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/check_release.py
      - scripts/third_party_licenses.py
      - Dockerfile
      - Cargo.toml
      - Cargo.lock
      - CHANGELOG.md
      - frontend/package-lock.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PUBLISH: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') }}
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  check:
    name: Release check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Versions, lock files and changelog agree
        run: |
          if [ "$PUBLISH" = "true" ]; then
            python3 scripts/check_release.py --tag "$GITHUB_REF_NAME" --notes notes.md
          else
            python3 scripts/check_release.py --notes notes.md
          fi
      - id: version
        run: |
          python3 -c 'import tomllib; print("version=" + tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])' >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: notes
          path: notes.md

  dashboard:
    name: Dashboard and license notices
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run check:api
          npm run build
      - name: Third-party license notices
        run: python3 scripts/third_party_licenses.py THIRD_PARTY_LICENSES.md
      - uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: frontend/dist
      - uses: actions/upload-artifact@v4
        with:
          name: licenses
          path: THIRD_PARTY_LICENSES.md

  binaries:
    name: Binaries (${{ matrix.target }})
    needs: [check, dashboard]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # An older Ubuntu, so the binaries run on older glibc versions.
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, target: aarch64-unknown-linux-gnu }
          - { os: macos-14, target: aarch64-apple-darwin }
          - { os: macos-14, target: x86_64-apple-darwin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    env:
      VERSION: ${{ needs.check.outputs.version }}
      TARGET: ${{ matrix.target }}
    # Bash on every runner, Windows included, so $TARGET and $VERSION expand.
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # Release binaries do not include live capture, which needs libpcap at
      # run time; the container image does.
      - name: Build
        run: cargo build --release --locked --target "$TARGET" -p cli -p api-server --features api-server/otel
      - uses: actions/download-artifact@v5
        with:
          name: dashboard
          path: dashboard
      - uses: actions/download-artifact@v5
        with:
          name: licenses
          path: licenses
      - name: Package
        run: |
          name="flowsentinel-$VERSION-$TARGET"
          exe=""
          case "$TARGET" in *windows*) exe=".exe" ;; esac
          mkdir -p "$name/config"
          cp "target/$TARGET/release/flowsentinel$exe" "$name/flowsentinel$exe"
          cp "target/$TARGET/release/api-server$exe" "$name/flowsentinel-api$exe"
          cp -R dashboard "$name/dashboard"
          cp -R docs "$name/docs"
          cp LICENSE README.md CHANGELOG.md SECURITY.md .env.example licenses/THIRD_PARTY_LICENSES.md "$name/"
          cp config/detection.example.toml "$name/config/"
          # Cross-compiled builds cannot run on this runner.
          if [ "$TARGET" != x86_64-apple-darwin ]; then
            "./$name/flowsentinel$exe" --version
            "./$name/flowsentinel-api$exe" --version | grep -qx "flowsentinel-api $VERSION"
          fi
          case "$TARGET" in
            *windows*) 7z a -tzip "$name.zip" "$name" > /dev/null; echo "ARCHIVE=$name.zip" >> "$GITHUB_ENV" ;;
            *) tar -czf "$name.tar.gz" "$name"; echo "ARCHIVE=$name.tar.gz" >> "$GITHUB_ENV" ;;
          esac
      - name: Attest build provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: ${{ env.ARCHIVE }}
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: ${{ env.ARCHIVE }}

  image:
    name: Container image (${{ matrix.platform }})
    needs: [check, dashboard]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, platform: linux/amd64, arch: amd64 }
          - { os: ubuntu-24.04-arm, platform: linux/arm64, arch: arm64 }
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # The notices for this exact build replace the committed copy.
      - uses: actions/download-artifact@v5
        with:
          name: licenses
          path: .
      - uses: docker/setup-buildx-action@v3
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          labels: |
            org.opencontainers.image.title=FlowSentinel
            org.opencontainers.image.description=Defensive, metadata-first network packet analyzer
            org.opencontainers.image.licenses=MIT
      # Built and tested locally first; nothing is pushed unless this passes.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          load: true
          tags: flowsentinel-release-test
          labels: ${{ steps.meta.outputs.labels }}
      - name: Smoke test
        run: |
          docker run --rm flowsentinel-release-test --version | grep -qx "flowsentinel-api $VERSION"
          test "$(docker run --rm --entrypoint id flowsentinel-release-test -u)" = "10001"
          docker run --rm --entrypoint test flowsentinel-release-test -s /usr/share/doc/flowsentinel/THIRD_PARTY_LICENSES.md
      - name: Sign in to ghcr.io
        if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # The same build (from cache), pushed by digest only: the tags are
      # added once every image and binary is ready.
      - name: Push by digest
        id: push
        if: env.PUBLISH == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          sbom: true
          provenance: mode=max
      - name: Record the digest
        if: env.PUBLISH == 'true'
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        if: env.PUBLISH == 'true'
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*

  publish:
    name: Publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [check, binaries, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # X.Y.Z, and X.Y for releases without a suffix. No `latest`: a patch on
      # an older line must not move it.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
      - name: Tag the multi-platform image
        id: manifest
        run: |
          sources=""
          for file in artifacts/digest-*/*; do
            sources="$sources $IMAGE@sha256:$(basename "$file")"
          done
          tags=$(jq -r '.tags | map("--tag " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools create $tags $sources
          digest=$(docker buildx imagetools inspect "$IMAGE:$VERSION" --format '{{json .Manifest}}' | jq -r .digest)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          docker buildx imagetools inspect "$IMAGE:$VERSION"
      - name: Attest the image's provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - name: Checksums
        run: |
          mkdir release
          mv artifacts/binary-*/* release/
          cd release && sha256sum * > SHA256SUMS && cat SHA256SUMS
      - name: Create the GitHub release
        run: |
          {
            cat artifacts/notes/notes.md
            printf '\n### Container image\n\nFor linux/amd64 and linux/arm64:\n\n```sh\ndocker pull %s:%s\n```\n' "$IMAGE" "$VERSION"
            printf '\nVerify downloads with `sha256sum -c SHA256SUMS --ignore-missing` and their provenance with `gh attestation verify FILE --repo %s`.\n' "$GITHUB_REPOSITORY"
          } > body.md
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag $prerelease \
            --title "FlowSentinel $VERSION" --notes-file body.md
