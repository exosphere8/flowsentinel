name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --workspace --locked

  msrv:
    name: Minimum supported Rust (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --all-targets --locked

  database:
    name: Database tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Throwaway server for this job only; no password is needed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FLOWSENTINEL_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
      # Fail instead of skipping if the URL above is ever missing.
      FLOWSENTINEL_REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Storage and API tests
        run: cargo test --locked -p storage -p api-server

  fixtures:
    name: Fixtures are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Uses the runner's preinstalled Python 3; the generator needs only the standard library.
      - name: Regenerate PCAP fixtures
        run: python3 scripts/generate_pcap_fixtures.py
      - name: Fail if fixtures changed
        run: |
          git status --porcelain fixtures
          git diff --exit-code -- fixtures
          test -z "$(git status --porcelain fixtures)"

  compose:
    name: Docker Compose services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create CI environment file
        run: |
          cp .env.example .env
          sed -i "s/=change-me$/=ci-$(openssl rand -hex 12)/" .env
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Start services and wait for health checks
        run: docker compose up -d --wait --wait-timeout 120
      - name: Show service status
        run: docker compose ps
      - name: Tear down
        if: always()
        run: docker compose down -v
