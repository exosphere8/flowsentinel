name: CI

on:
  push:
    # Feature branches are checked before they are merged into main.
    branches: [main, "feature/**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --workspace --locked
      - name: Build
        run: cargo build --workspace --locked

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # RustSec advisories, licenses, banned and duplicate crates, sources
      # (deny.toml).
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Release metadata is consistent
        run: python3 scripts/check_release.py
      - name: npm audit (high and critical)
        working-directory: frontend
        run: npm audit --audit-level=high

  live:
    name: Live capture (libpcap) and OpenTelemetry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install libpcap
        run: sudo apt-get update && sudo apt-get install -y libpcap-dev
      - name: Clippy with libpcap
        run: cargo clippy --workspace --all-targets --locked --features api-server/live-capture -- -D warnings
      - name: Test with libpcap
        run: cargo test --workspace --locked --features api-server/live-capture
      - name: Clippy and test with OpenTelemetry
        run: |
          cargo clippy -p api-server --all-targets --locked --features otel -- -D warnings
          cargo test -p api-server --locked --features otel --test otel
      - name: Capture loopback traffic with CAP_NET_RAW only, as an unprivileged user
        run: |
          bin=$(cargo test --locked -p live-capture --features libpcap --test session --no-run \
            --message-format=json | jq -r 'select(.executable != null and .target.name == "session") | .executable')
          sudo setcap cap_net_raw=eip "$bin"
          out=$(FLOWSENTINEL_LIVE_TEST_INTERFACE=lo "$bin" captures_loopback_traffic_when_permitted --exact)
          echo "$out"
          # Fail if the test was filtered away instead of run.
          echo "$out" | grep -q "1 passed"

  msrv:
    name: Minimum supported Rust (1.85)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@1.85.0
      - uses: Swatinem/rust-cache@v2
      - name: Check
        run: cargo check --workspace --all-targets --locked
      - name: Check with OpenTelemetry
        run: cargo check -p api-server --all-targets --locked --features otel

  database:
    name: Database tests (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Throwaway server for this job only; no password is needed.
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      FLOWSENTINEL_TEST_DATABASE_URL: postgres://postgres@127.0.0.1:5432/postgres
      # Fail instead of skipping if the URL above is ever missing.
      FLOWSENTINEL_REQUIRE_DB_TESTS: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Storage and API tests
        run: cargo test --locked -p storage -p api-server

  fixtures:
    name: Fixtures are reproducible
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Uses the runner's preinstalled Python 3; the generator needs only the standard library.
      - name: Regenerate PCAP fixtures
        run: python3 scripts/generate_pcap_fixtures.py
      - name: Fail if fixtures changed
        run: |
          git status --porcelain fixtures
          git diff --exit-code -- fixtures
          test -z "$(git status --porcelain fixtures)"

  compose:
    name: Docker Compose services
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create CI environment file
        run: |
          cp .env.example .env
          sed -i "s/=change-me$/=ci-$(openssl rand -hex 12)/" .env
      - name: Validate compose file
        run: docker compose config --quiet
      - name: Validate compose file with the app profile
        run: docker compose --profile app config --quiet
      - name: Start services and wait for health checks
        run: docker compose up -d --wait --wait-timeout 120
      - name: Build and start the API server and dashboard
        run: docker compose --profile app up -d --build --wait --wait-timeout 600
      - name: Check the API and the dashboard
        run: |
          curl -fsS http://127.0.0.1:8080/health
          # The API needs a session; create the first admin and sign in.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/api/v1/overview)" = "401"
          password="ci-$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          printf '%s\n' "$password" | docker compose --profile app exec -T app \
            flowsentinel-api create-user --username admin --role admin
          curl -fsS -c "$RUNNER_TEMP/cookies" -H 'Content-Type: application/json' \
            -d "{\"username\":\"admin\",\"password\":\"$password\"}" \
            http://127.0.0.1:8080/api/v1/auth/login > /dev/null
          curl -fsS -b "$RUNNER_TEMP/cookies" http://127.0.0.1:8080/api/v1/overview
          curl -fsS http://127.0.0.1:8080/ | grep -q '<div id="root">'
          curl -fsSI http://127.0.0.1:8080/ | grep -qi "content-security-policy"
          # The container runs as an unprivileged user.
          test "$(docker compose exec -T app id -u)" = "10001"
      - name: Show service status
        if: always()
        run: docker compose --profile app ps && docker compose --profile app logs app --tail 50
      - name: Tear down
        if: always()
        run: docker compose --profile app down -v

  frontend:
    name: Dashboard (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: API types match docs/openapi.json
        run: npm run check:api
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build

  e2e:
    name: Dashboard end to end
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build the API server
        run: cargo build --locked -p api-server
      - name: Build the dashboard
        working-directory: frontend
        run: npm ci --no-audit --no-fund && npm run build
      - name: Install Chromium for Playwright
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Start the API server with the dashboard
        run: |
          mkdir -p "$RUNNER_TEMP/uploads"
          # A throwaway first admin for the smoke tests.
          password="ci-$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "E2E_ADMIN_PASSWORD=$password" >> "$GITHUB_ENV"
          printf '%s\n' "$password" > "$RUNNER_TEMP/admin-password"
          FLOWSENTINEL_DATABASE_URL=postgres://postgres@127.0.0.1:5432/postgres \
          FLOWSENTINEL_API_ADDR=127.0.0.1:18080 \
          FLOWSENTINEL_UPLOAD_DIR="$RUNNER_TEMP/uploads" \
          FLOWSENTINEL_DASHBOARD_DIR="$PWD/frontend/dist" \
          FLOWSENTINEL_ADMIN_PASSWORD_FILE="$RUNNER_TEMP/admin-password" \
            nohup target/debug/api-server > "$RUNNER_TEMP/api-server.log" 2>&1 &
          for _ in $(seq 1 60); do
            curl -fsS http://127.0.0.1:18080/health && exit 0
            sleep 1
          done
          cat "$RUNNER_TEMP/api-server.log"
          exit 1
      - name: Smoke tests
        working-directory: frontend
        env:
          E2E_BASE_URL: http://127.0.0.1:18080
        run: npm run e2e
      - name: Server log
        if: always()
        run: tail -n 100 "$RUNNER_TEMP/api-server.log"
