# Secret scanning with gitleaks (.gitleaks.toml). Pushes and pull requests
# scan their new commits; the weekly run, and a manual one, scan the whole
# Git history.
name: Secret scan

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
