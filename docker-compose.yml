# Local services. The API server stores capture metadata in PostgreSQL (see
# FLOWSENTINEL_DATABASE_URL in .env.example).
#
#   docker compose up -d --wait                  PostgreSQL, for `make dev`
#   docker compose --profile app up -d --build   ...plus the API server with the
#                                                dashboard on http://127.0.0.1:8080
#
# Create the first admin once the app runs (the password is read from stdin):
#   read -rs PW && printf '%s\n' "$PW" | docker compose --profile app exec -T app \
#     flowsentinel-api create-user --username admin --role admin
#
# Ports bind to 127.0.0.1 only. Credentials come from .env (see .env.example);
# compose refuses to start if the password is unset.

name: flowsentinel

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-flowsentinel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-flowsentinel}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # The API server and dashboard, built from the Dockerfile. Optional: the
  # `app` profile keeps `docker compose up` to the databases for development.
  app:
    profiles: ["app"]
    build: .
    # To run a published release instead of building, set in .env
    #   FLOWSENTINEL_IMAGE=ghcr.io/exosphere8/flowsentinel:0.1.0
    # then run (see docs/installation.md):
    #   docker compose --profile app pull app
    #   docker compose --profile app up -d --no-build --wait
    image: ${FLOWSENTINEL_IMAGE:-flowsentinel-api:local}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      FLOWSENTINEL_DATABASE_URL: postgres://${POSTGRES_USER:-flowsentinel}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-flowsentinel}
      # Unset: only localhost/127.0.0.1 are answered. Otherwise every host
      # name clients use, comma-separated (see docs/api.md).
      FLOWSENTINEL_ALLOWED_HOSTS: ${FLOWSENTINEL_ALLOWED_HOSTS:-}
      RUST_LOG: ${RUST_LOG:-info}
      # true when an HTTPS reverse proxy is in front (see docs/authentication.md).
      FLOWSENTINEL_SECURE_COOKIES: ${FLOWSENTINEL_SECURE_COOKIES:-false}
    ports:
      - "127.0.0.1:${FLOWSENTINEL_PORT:-8080}:8080"
    volumes:
      - uploads:/var/lib/flowsentinel/uploads
    # The server writes only to the upload volume; nothing else needs to be
    # writable, and it needs no Linux capabilities.
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    # Bounds runaway thread or process creation. The server peaked at 30
    # threads on a 4-CPU host under heavy mixed load; it starts one worker
    # thread per CPU, so raise this on hosts with more than about 128 CPUs.
    pids_limit: 256

volumes:
  postgres-data:
  uploads:
