# Coverage-guided fuzz targets for the parsers. Requires a nightly toolchain
# and cargo-fuzz; see fuzz/README.md. Kept out of the main workspace so the
# stable build and CI are unaffected.
[package]
name = "flowsentinel-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT"
authors = ["exosphere8"]

[package.metadata]
cargo-fuzz = true

[dependencies]
api-server = { path = "../crates/api-server" }
live-capture = { path = "../crates/live-capture" }
capture = { path = "../crates/capture" }
decoder = { path = "../crates/decoder" }
detection-engine = { path = "../crates/detection-engine" }
filter-language = { path = "../crates/filter-language" }
flow-engine = { path = "../crates/flow-engine" }
serde_json = "1.0.151"
libfuzzer-sys = "0.4.13"

[[bin]]
name = "decode_packet"
path = "fuzz_targets/decode_packet.rs"
test = false
doc = false
bench = false

[[bin]]
name = "application"
path = "fuzz_targets/application.rs"
test = false
doc = false
bench = false

[[bin]]
name = "filter"
path = "fuzz_targets/filter.rs"
test = false
doc = false
bench = false

[[bin]]
name = "detect"
path = "fuzz_targets/detect.rs"
test = false
doc = false
bench = false

[[bin]]
name = "flows"
path = "fuzz_targets/flows.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pcap_reader"
path = "fuzz_targets/pcap_reader.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]

[[bin]]
name = "request_inputs"
path = "fuzz_targets/request_inputs.rs"
test = false
doc = false
bench = false
